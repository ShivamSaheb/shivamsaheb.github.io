    <!--
        Music transition.

        This is intentionally on the About page rather than
        relying on the audio element from index.html to survive
        navigation.
    -->

    <audio id="bgMusic" src="../Extras/PER.mp3" preload="auto"></audio>


    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const audio = document.getElementById("bgMusic");

            const musicPlaying =
                sessionStorage.getItem("musicPlaying");

            const savedTime =
                parseFloat(
                    sessionStorage.getItem("musicTime")
                );


            /*
             * Only continue the music if the user arrived
             * here through ENTER.
             */

            if (
                musicPlaying === "true" &&
                audio
            ) {

                /*
                 * Wait until the browser has loaded enough
                 * metadata to seek to the correct position.
                 */

                audio.addEventListener(
                    "loadedmetadata",
                    () => {

                        if (!isNaN(savedTime)) {

                            /*
                             * Continue from the exact point
                             * at which the landing page left off.
                             */

                            audio.currentTime = savedTime;

                        }

                        audio.volume = 0.8;

                        audio.play().catch(error => {

                            console.log(
                                "Audio continuation blocked:",
                                error
                            );

                        });

                    },
                    { once: true }
                );

            }

        });

    </script>
